name: NODE API CICD

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      
      - name: Install Dependencies
        run: npm install
      
      - name: Verify Application
        run: |
          timeout 5 node index.js || true
          echo "✅ Application verified successfully"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H ${{ secrets.DEPLOY_SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null
      
      - name: Deploy to Server
        run: |
          ssh -i ~/.ssh/id_deploy ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_SERVER_IP }} << 'DEPLOY_SCRIPT'
          
          set -e
          
          echo "🚀 Deployment started..."
          
          cd ${{ secrets.DEPLOY_PATH }}
          
          echo "📥 Pulling latest code from GitHub..."
          git pull origin main
          
          echo "📦 Installing dependencies..."
          npm install --production
          
          echo "♻️  Restarting PM2 application..."
          pm2 restart all --update-env
          
          echo "✅ Deployment completed successfully!"
          pm2 status
          
          DEPLOY_SCRIPT
      
      - name: Health Check
        run: |
          echo "🏥 Running health check..."
          sleep 3
          curl -f http://${{ secrets.DEPLOY_SERVER_IP }} && echo "✅ App is healthy!" || echo "⚠️  Connection issue (might be normal)"